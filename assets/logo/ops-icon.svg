<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b48" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#071526" stop-opacity="1"/>
    </radialGradient>

    <!-- Pillar 1: Água (Cyan/Sky Blue) -->
    <linearGradient id="gradAgua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pillar 2: Esgoto / Tratamento (Indigo / Royal Blue) -->
    <linearGradient id="gradEsgoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Pillar 3: Drenagem / Manejo Pluvial (Cyan / Deep Teal) -->
    <linearGradient id="gradDrenagem" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Pillar 4: Resíduos Sólidos (Paraná Emerald Green) -->
    <linearGradient id="gradResiduo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Center Droplet Gradient -->
    <linearGradient id="gradDrop" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Center Leaf Gradient -->
    <linearGradient id="gradLeaf" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Outer Tech Orbit Glow -->
    <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters for Depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle (Optional Dark Shield) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>

  <!-- Technical Observatory Ring & Ticks -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#gradRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12"/>
  
  <!-- Compass / Observatory Crosshairs (Subtle Precision Elements) -->
  <line x1="256" y1="26" x2="256" y2="44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="468" x2="256" y2="486" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="26" y1="256" x2="44" y2="256" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="468" y1="256" x2="486" y2="256" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Group of 4 Fluid Arcs (The 4 Sanitation Axes forming the Observatory Aperture) -->
  <g filter="url(#softShadow)">
    
    <!-- EIXO 1: ÁGUA (Top-Right Arc) -->
    <!-- Arc from 0 deg to 80 deg -->
    <path d="M 278,92 
             A 168,168 0 0,1 420,234 
             C 418,248 402,248 392,238 
             A 138,138 0 0,0 274,124 
             C 264,114 266,94 278,92 Z" 
          fill="url(#gradAgua)"/>

    <!-- Small Accent Droplet Orbiting Arc 1 -->
    <circle cx="370" cy="142" r="5" fill="#bae6fd" opacity="0.9"/>

    <!-- EIXO 2: ESGOTO & TRATAMENTO (Bottom-Right Arc) -->
    <!-- Arc from 95 deg to 175 deg -->
    <path d="M 420,278 
             A 168,168 0 0,1 278,420 
             C 266,418 264,398 274,388 
             A 138,138 0 0,0 392,274 
             C 402,264 418,264 420,278 Z" 
          fill="url(#gradEsgoto)"/>

    <!-- Small Accent Node Orbiting Arc 2 -->
    <circle cx="370" cy="370" r="5" fill="#c7d2fe" opacity="0.9"/>

    <!-- EIXO 3: DRENAGEM & MANEJO PLUVIAL (Bottom-Left Arc) -->
    <!-- Arc from 185 deg to 265 deg -->
    <path d="M 234,420 
             A 168,168 0 0,1 92,278 
             C 94,264 110,264 120,274 
             A 138,138 0 0,0 238,392 
             C 248,402 246,418 234,420 Z" 
          fill="url(#gradDrenagem)"/>

    <!-- Small Accent Node Orbiting Arc 3 -->
    <circle cx="142" cy="370" r="5" fill="#a5f3fc" opacity="0.9"/>

    <!-- EIXO 4: RESÍDUOS SÓLIDOS & ECONOMIA CIRCULAR (Top-Left Arc) -->
    <!-- Arc from 275 deg to 355 deg -->
    <path d="M 92,234 
             A 168,168 0 0,1 234,92 
             C 246,94 248,114 238,124 
             A 138,138 0 0,0 120,238 
             C 110,248 94,248 92,234 Z" 
          fill="url(#gradResiduo)"/>

    <!-- Small Accent Node Orbiting Arc 4 -->
    <circle cx="142" cy="142" r="5" fill="#bbf7d0" opacity="0.9"/>

  </g>

  <!-- Central Dynamic Symbol: The Glistening Water Drop intertwined with the Ecological Leaf -->
  <g filter="url(#softShadow)">
    
    <!-- Leaf (Left side of center - Green) -->
    <path d="M 256,160 
             C 210,185 180,230 186,285 
             C 192,335 235,355 256,352 
             C 245,310 248,245 256,160 Z" 
          fill="url(#gradLeaf)"/>
    
    <!-- Stylized Leaf Stem / Vein -->
    <path d="M 215,318 C 228,295 240,260 252,210" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Water Drop (Right side of center - Water Blue) -->
    <path d="M 256,160 
             C 265,245 268,310 256,352 
             C 285,355 324,330 326,285 
             C 328,230 295,185 256,160 Z" 
          fill="url(#gradDrop)"/>

    <!-- Droplet Light Reflection Highlight -->
    <path d="M 292,225 
             C 305,250 305,285 288,308 
             C 294,285 296,255 286,232 
             C 284,228 288,222 292,225 Z" 
          fill="#ffffff" opacity="0.6"/>

    <!-- Top Apex Convergence Star -->
    <circle cx="256" cy="160" r="4.5" fill="#ffffff" filter="url(#glow)"/>

    <!-- Wave lines across droplet center symbolizing treatment & drainage flow -->
    <path d="M 230,270 C 242,264 260,276 282,268" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M 226,290 C 244,284 258,296 286,288" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 4 Micro Badges for the 4 axes around the emblem -->
  <!-- Top: Água -->
  <g transform="translate(256, 52)">
    <circle cx="0" cy="0" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 0,-6 C 3,-2 5,1 5,4 A 5,5 0 0,1 -5,4 C -5,1 -3,-2 0,-6 Z" fill="#ffffff"/>
  </g>

  <!-- Right: Esgoto -->
  <g transform="translate(460, 256)">
    <circle cx="0" cy="0" r="14" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
    <path d="M -5,-2 C -3,-5 3,-5 5,-2 C 3,1 -3,1 -5,-2 Z M -4,3 C -2,1 2,1 4,3" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Bottom: Drenagem -->
  <g transform="translate(256, 460)">
    <circle cx="0" cy="0" r="14" fill="#0e7490" stroke="#06b6d4" stroke-width="2"/>
    <path d="M -4,-3 C -2,-5 2,-5 4,-3 M -5,1 C -3,-1 3,-1 5,1 M -4,5 C -2,3 2,3 4,5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Left: Resíduo -->
  <g transform="translate(52, 256)">
    <circle cx="0" cy="0" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <path d="M -4,-4 L 4,-4 L 1,-1 M 4,1 L 4,5 L 0,2 M -1,4 L -5,1 L -2,-1" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
