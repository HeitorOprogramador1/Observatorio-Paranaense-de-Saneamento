<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" height="100%">
  <defs>
    <!-- Gradients for Emblem -->
    <linearGradient id="hGradAgua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hGradEsgoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="hGradDrenagem" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="hGradResiduo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hGradDrop" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="hGradLeaf" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hGradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="hDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM (Left: 100, 100 - radius ~80) ================= -->
  <g transform="translate(10, 0)">
    <!-- Observatory Ring -->
    <circle cx="100" cy="100" r="84" fill="none" stroke="url(#hGradRing)" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.6"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

    <!-- Ticks -->
    <line x1="100" y1="10" x2="100" y2="18" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="182" x2="100" y2="190" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="100" x2="18" y2="100" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <line x1="182" y1="100" x2="190" y2="100" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>

    <!-- 4 Arcs (Scaled & Centered at 100, 100) -->
    <!-- Scale factor ~0.38, translate offset -->
    <g transform="translate(100, 100) scale(0.38) translate(-256, -256)" filter="url(#hDropShadow)">
      <!-- Arc 1: Água -->
      <path d="M 278,92 A 168,168 0 0,1 420,234 C 418,248 402,248 392,238 A 138,138 0 0,0 274,124 C 264,114 266,94 278,92 Z" fill="url(#hGradAgua)"/>
      <circle cx="370" cy="142" r="6" fill="#bae6fd"/>

      <!-- Arc 2: Esgoto -->
      <path d="M 420,278 A 168,168 0 0,1 278,420 C 266,418 264,398 274,388 A 138,138 0 0,0 392,274 C 402,264 418,264 420,278 Z" fill="url(#hGradEsgoto)"/>
      <circle cx="370" cy="370" r="6" fill="#c7d2fe"/>

      <!-- Arc 3: Drenagem -->
      <path d="M 234,420 A 168,168 0 0,1 92,278 C 94,264 110,264 120,274 A 138,138 0 0,0 238,392 C 248,402 246,418 234,420 Z" fill="url(#hGradDrenagem)"/>
      <circle cx="142" cy="370" r="6" fill="#a5f3fc"/>

      <!-- Arc 4: Resíduos -->
      <path d="M 92,234 A 168,168 0 0,1 234,92 C 246,94 248,114 238,124 A 138,138 0 0,0 120,238 C 110,248 94,248 92,234 Z" fill="url(#hGradResiduo)"/>
      <circle cx="142" cy="142" r="6" fill="#bbf7d0"/>

      <!-- Center Leaf -->
      <path d="M 256,160 C 210,185 180,230 186,285 C 192,335 235,355 256,352 C 245,310 248,245 256,160 Z" fill="url(#hGradLeaf)"/>
      <path d="M 215,318 C 228,295 240,260 252,210" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

      <!-- Center Water Drop -->
      <path d="M 256,160 C 265,245 268,310 256,352 C 285,355 324,330 326,285 C 328,230 295,185 256,160 Z" fill="url(#hGradDrop)"/>
      <path d="M 292,225 C 305,250 305,285 288,308 C 294,285 296,255 286,232 C 284,228 288,222 292,225 Z" fill="#ffffff" opacity="0.6"/>

      <!-- Center Wave lines -->
      <path d="M 230,270 C 242,264 260,276 282,268" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <circle cx="256" cy="160" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY (Right: X=215) ================= -->
  <g transform="translate(215, 0)">
    
    <!-- OPS Header Line -->
    <g transform="translate(0, 78)">
      <!-- OPS Acronym -->
      <text x="0" y="0" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">
        OPS
      </text>

      <!-- Vertical Divider -->
      <line x1="140" y1="-50" x2="140" y2="4" stroke="#334155" stroke-width="2"/>

      <!-- PARANÁ Pill -->
      <g transform="translate(155, -42)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#065f46" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2"/>
        <text x="52.5" y="17.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#34d399" text-anchor="middle">
          PARANÁ
        </text>
      </g>

      <!-- Institutional Subtitle -->
      <text x="155" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#94a3b8">
        GOVERNO DO ESTADO • SECID • AGEPAR
      </text>
    </g>

    <!-- Main Title: OBSERVATÓRIO PARANAENSE DO SANEAMENTO -->
    <text x="0" y="116" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5" fill="#f8fafc">
      OBSERVATÓRIO PARANAENSE DO SANEAMENTO
    </text>

    <!-- The 4 Pillars Subtitle with Thematic Color Badges -->
    <g transform="translate(0, 150)">
      <!-- 1. Água -->
      <circle cx="6" cy="-4" r="4.5" fill="#38bdf8"/>
      <text x="16" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#38bdf8">
        ÁGUA
      </text>

      <text x="68" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#475569">•</text>

      <!-- 2. Esgoto -->
      <circle cx="86" cy="-4" r="4.5" fill="#818cf8"/>
      <text x="96" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#818cf8">
        ESGOTO
      </text>

      <text x="162" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#475569">•</text>

      <!-- 3. Drenagem -->
      <circle cx="180" cy="-4" r="4.5" fill="#22d3ee"/>
      <text x="190" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#22d3ee">
        DRENAGEM
      </text>

      <text x="278" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#475569">•</text>

      <!-- 4. Resíduos -->
      <circle cx="296" cy="-4" r="4.5" fill="#34d399"/>
      <text x="306" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#34d399">
        RESÍDUO
      </text>

      <!-- Marco Legal Tag -->
      <g transform="translate(400, -14)">
        <rect x="0" y="0" width="135" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="67.5" y="13.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.6" fill="#94a3b8" text-anchor="middle">
          LEI 11.445 / 14.026
        </text>
      </g>
    </g>

  </g>
</svg>
