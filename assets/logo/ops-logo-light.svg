<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="100%" height="100%">
  <defs>
    <!-- Gradients for Emblem -->
    <linearGradient id="lGradAgua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lGradEsgoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="lGradDrenagem" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="lGradResiduo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="lGradDrop" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="lGradLeaf" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="lGradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="lDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM (Left: 100, 100 - radius ~80) ================= -->
  <g transform="translate(10, 0)">
    <!-- Observatory Ring -->
    <circle cx="100" cy="100" r="84" fill="none" stroke="url(#lGradRing)" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.6"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#64748b" stroke-width="1" opacity="0.2"/>

    <!-- Ticks -->
    <line x1="100" y1="10" x2="100" y2="18" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="182" x2="100" y2="190" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="100" x2="18" y2="100" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <line x1="182" y1="100" x2="190" y2="100" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>

    <!-- 4 Arcs (Scaled & Centered at 100, 100) -->
    <g transform="translate(100, 100) scale(0.38) translate(-256, -256)" filter="url(#lDropShadow)">
      <!-- Arc 1: Água -->
      <path d="M 278,92 A 168,168 0 0,1 420,234 C 418,248 402,248 392,238 A 138,138 0 0,0 274,124 C 264,114 266,94 278,92 Z" fill="url(#lGradAgua)"/>
      <circle cx="370" cy="142" r="6" fill="#0284c7"/>

      <!-- Arc 2: Esgoto -->
      <path d="M 420,278 A 168,168 0 0,1 278,420 C 266,418 264,398 274,388 A 138,138 0 0,0 392,274 C 402,264 418,264 420,278 Z" fill="url(#lGradEsgoto)"/>
      <circle cx="370" cy="370" r="6" fill="#4f46e5"/>

      <!-- Arc 3: Drenagem -->
      <path d="M 234,420 A 168,168 0 0,1 92,278 C 94,264 110,264 120,274 A 138,138 0 0,0 238,392 C 248,402 246,418 234,420 Z" fill="url(#lGradDrenagem)"/>
      <circle cx="142" cy="370" r="6" fill="#0891b2"/>

      <!-- Arc 4: Resíduos -->
      <path d="M 92,234 A 168,168 0 0,1 234,92 C 246,94 248,114 238,124 A 138,138 0 0,0 120,238 C 110,248 94,248 92,234 Z" fill="url(#lGradResiduo)"/>
      <circle cx="142" cy="142" r="6" fill="#059669"/>

      <!-- Center Leaf -->
      <path d="M 256,160 C 210,185 180,230 186,285 C 192,335 235,355 256,352 C 245,310 248,245 256,160 Z" fill="url(#lGradLeaf)"/>
      <path d="M 215,318 C 228,295 240,260 252,210" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

      <!-- Center Water Drop -->
      <path d="M 256,160 C 265,245 268,310 256,352 C 285,355 324,330 326,285 C 328,230 295,185 256,160 Z" fill="url(#lGradDrop)"/>
      <path d="M 292,225 C 305,250 305,285 288,308 C 294,285 296,255 286,232 C 284,228 288,222 292,225 Z" fill="#ffffff" opacity="0.7"/>

      <!-- Center Wave lines -->
      <path d="M 230,270 C 242,264 260,276 282,268" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <circle cx="256" cy="160" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY (Right: X=215) ================= -->
  <g transform="translate(215, 0)">
    
    <!-- OPS Header Line -->
    <g transform="translate(0, 78)">
      <!-- OPS Acronym -->
      <text x="0" y="0" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="url(#lTextGrad)">
        OPS
      </text>

      <!-- Vertical Divider -->
      <line x1="140" y1="-50" x2="140" y2="4" stroke="#cbd5e1" stroke-width="2"/>

      <!-- PARANÁ Pill -->
      <g transform="translate(155, -42)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
        <text x="52.5" y="17.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#047857" text-anchor="middle">
          PARANÁ
        </text>
      </g>

      <!-- Institutional Subtitle -->
      <text x="155" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#64748b">
        GOVERNO DO ESTADO • SECID • AGEPAR
      </text>
    </g>

    <!-- Main Title: OBSERVATÓRIO PARANAENSE DO SANEAMENTO -->
    <text x="0" y="116" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5" fill="#0f172a">
      OBSERVATÓRIO PARANAENSE DO SANEAMENTO
    </text>

    <!-- The 4 Pillars Subtitle with Thematic Color Badges -->
    <g transform="translate(0, 150)">
      <!-- 1. Água -->
      <circle cx="6" cy="-4" r="4.5" fill="#0284c7"/>
      <text x="16" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#0284c7">
        ÁGUA
      </text>

      <text x="68" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">•</text>

      <!-- 2. Esgoto -->
      <circle cx="86" cy="-4" r="4.5" fill="#4f46e5"/>
      <text x="96" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#4f46e5">
        ESGOTO
      </text>

      <text x="162" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">•</text>

      <!-- 3. Drenagem -->
      <circle cx="180" cy="-4" r="4.5" fill="#0891b2"/>
      <text x="190" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#0891b2">
        DRENAGEM
      </text>

      <text x="278" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">•</text>

      <!-- 4. Resíduos -->
      <circle cx="296" cy="-4" r="4.5" fill="#059669"/>
      <text x="306" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#059669">
        RESÍDUO
      </text>

      <!-- Marco Legal Tag -->
      <g transform="translate(400, -14)">
        <rect x="0" y="0" width="135" height="20" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text x="67.5" y="13.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.6" fill="#475569" text-anchor="middle">
          LEI 11.445 / 14.026
        </text>
      </g>
    </g>

  </g>
</svg>
